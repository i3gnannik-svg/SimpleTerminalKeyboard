name: Build for Anbernic

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies and cross-compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential make pkg-config gcc-aarch64-linux-gnu libc6-dev-arm64-cross libsdl2-dev:arm64 libsdl2-ttf-dev:arm64

    - name: Build
      run: |
        export CC=aarch64-linux-gnu-gcc
        export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
        export PKG_CONFIG_SYSROOT_DIR=/
        make PLATFORM=r36s CC="$CC" || make PLATFORM=h700 CC="$CC" || make CC="$CC"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-terminal-arm64
        path: simple-terminal
